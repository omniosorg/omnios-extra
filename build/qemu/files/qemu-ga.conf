#
# Configuration for the QEMU guest agent, svc:/ooce/system/qemu-ga
# See qemu-ga(8) for the available options. Restart the service after
# making changes.
#

[general]

# illumos does not have a virtio-serial (virtio-console) driver, so the
# guest agent must use an emulated ISA serial port. In Proxmox VE, for
# example, set the VM's agent option to 'enabled=1,type=isa'.
method=isa-serial

# The default is the second serial port, COM2 (/dev/term/b). Hypervisors
# such as Proxmox VE attach the agent to the first ISA serial port that is
# not otherwise in use, which is COM1 (/dev/term/a) if the VM has no other
# serial port configured.
# Make sure that the port is not used as the system console (including the
# 'console', 'input-device' and 'output-device' boot properties - see
# eeprom(8)), and that the corresponding svc:/system/console-login:term?
# instance is disabled.
#path=/dev/term/b

# Comma-separated lists of RPCs to block or allow. Run
# 'qemu-ga --block-rpcs=help' to list the available RPCs.
#block-rpcs=guest-file-open,guest-exec
#allow-rpcs=

# Log extra debugging information to the service log.
#verbose=false
